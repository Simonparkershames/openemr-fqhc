name: Composer Require Checker

on:
  push:
    branches:
    - master
    - rel-*
    paths:
    - '**.php'
    - .composer-require-checker.json
    - .github/workflows/composer-require-checker.yml
    - composer.json
    - composer.lock
  # Deliberately NOT path-filtered, unlike the push trigger above.
  #
  # `composer-require-checker` is one of master's required status checks. A
  # path-filtered workflow does not run at all when nothing matches, so it
  # reports no status — and GitHub treats a required context with no result as
  # unsatisfied, not as passed. That made every PR touching no PHP (docs-only,
  # CI-only) permanently unmergeable regardless of how green everything else
  # was. Running the job unconditionally costs about a minute on those PRs and
  # is the cheapest way to make the required context always resolve.
  #
  # If the check is ever dropped from the required contexts in branch
  # protection, the filter can come back. See issue #71.
  pull_request:
    branches:
    - master
    - rel-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  composer-require-checker:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: ./.github/actions/setup-php-composer
      with:
        php-version: '8.2'
        extensions: bcmath, calendar, ctype, curl, dom, fileinfo, filter, gd, iconv, imagick, intl, json, ldap, libxml, mbstring, mysqli, openssl, pdo, pdo_mysql, phar, session, simplexml, soap, sockets, sodium, tokenizer, xml, xmlreader, xmlwriter, xsl, zip, zlib

    - name: Run Composer Require Checker
      run: composer require-checker
